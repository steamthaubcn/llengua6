function renderExercise(s){
  const it = s.items[s.i];
  const pct = Math.round((s.i)/s.items.length*100);
  let body = '';
  const disabled = it.checked ? 'disabled' : '';

  if(it.t==='mc'){
    const filled = it.checked ? it.a : it.ans;
    let promptHtml;
    if(it.art){ promptHtml = it.checked ? fmt(artPhrase(it, it.a)) : fmt(it.q).replace('___', `<span class="blank">${filled?esc(filled):'&nbsp;'}</span>`); }
    else if(it.q.includes('___')) promptHtml = fmt(it.q).replace('___', `<span class="blank ${it.checked?'filled':''}">${filled?esc(filled):'&nbsp;'}</span>`);
    else promptHtml = fmt(it.q);
    const short = it.order.every(o=>o.length<=12);
    body = `<p class="prompt">${promptHtml}</p>
      <div class="opts ${short?'cols':''}">
      ${it.order.map((o,k)=>{
        let cls='', tag='';
        if(it.checked){ if(o===it.a){cls='right'; tag='<span class="tag">✓ Correcta</span>';} else if(o===it.ans){cls='wrong'; tag='<span class="tag">✗ La teva</span>';} }
        return `<button class="opt ${cls}" data-act="opt" data-v="${esc(o)}" data-fk="o${k}" aria-pressed="${it.ans===o}" ${disabled}><span>${esc(o)}</span>${tag}</button>`;
      }).join('')}
      </div>`;
  }

  if(it.t==='fill'){
    const shown = it.checked ? `${esc(it.before)}<mark>${esc(it.a)||'·'}</mark>${esc(it.after)}`.replace('<mark>·</mark>','') 
                              : `${esc(it.before)}<span class="blank">${it.ans!==null?esc(it.ans):'&nbsp;'}</span>${esc(it.after)}`;
    body = `<p class="prompt">${esc(it.topic.fillQ || 'Quina grafia hi va?')}</p>
      ${it.hint ? `<p class="hint">${esc(it.hint)}</p>` : ''}
      <div class="word-big">${shown}</div>
      <div class="grapheme">
      ${it.order.map((o,k)=>{
        let cls='';
        if(it.checked){ if(o===it.a) cls='right'; else if(o===it.ans) cls='wrong'; }
        const label = o==='' ? 'sense h' : o;
        return `<button class="opt ${cls} ${o===''?'small':''}" data-act="opt" data-v="${esc(o)}" data-fk="o${k}" aria-pressed="${it.ans===o}" aria-label="${esc(label)}" ${disabled}>${esc(label)}</button>`;
      }).join('')}
      </div>`;
  }

  if(it.t==='write'){
    const g = it.checked ? grade(it) : null;
    body = `<p class="prompt">${fmt(it.q)}</p>
      <label for="inp" class="muted" style="display:block;margin-bottom:6px">La teva resposta</label>
      <input id="inp" class="inp ${g?(g.ok?'right':'wrong'):''}" data-fk="inp" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(it.ans)}" ${it.checked?'readonly':''}>
      ${it.checked ? '' : `<div class="chars" aria-label="Caràcters especials">
        ${['à','è','é','í','ï','ò','ó','ú','ü','ç','·','’','-'].map(c=>`<button type="button" data-char="${c}" aria-label="Insereix ${c}">${c}</button>`).join('')}
      </div>`}`;
  }

  if(it.t==='cls'){
    body = `<p class="prompt">${esc(it.q)}</p><div>
      ${it.words.map((w,wi)=>{
        const right = it.checked && it.ans[wi]===w[1];
        return `<div class="cls-row">
          <span class="cls-word">${fmt(w[0])}</span>
          <div class="seg" role="group" aria-label="${esc(plain(w[0]))}">
          ${it.cats.map((c,ci)=>{
            let cls='';
            if(it.checked){ if(ci===w[1] && it.ans[wi]===ci) cls='right'; else if(it.ans[wi]===ci) cls='wrong'; else if(ci===w[1]) cls='missed'; }
            return `<button class="${cls}" data-act="cls" data-w="${wi}" data-c="${ci}" data-fk="c${wi}-${ci}" aria-pressed="${it.ans[wi]===ci}" ${disabled}>${esc(c)}</button>`;
          }).join('')}
          </div>
          ${it.checked ? `<span class="cls-mark ${right?'ok':'ko'}" aria-label="${right?'correcta':'incorrecta'}">${right?'✓':'✗'}</span>` : ''}
        </div>`;}).join('')}
      </div>`;
  }

  if(it.t==='comma'){
    body = `<p class="prompt">Toca els espais on falta una coma.</p>
      <p class="sentence">${it.words.map((w,wi)=>{
        if(wi===it.words.length-1) return `<span class="wg">${esc(w)}</span>`;
        const on = it.ans.has(wi); let cls='', ch = on ? ',' : '<span class="dot"></span>';
        if(it.checked){ const need = it.gaps.has(wi); if(need&&on) cls='ok'; else if(need&&!on){cls='missed'; ch=',';} else if(!need&&on) cls='extra'; }
        return `<span class="wg">${esc(w)}<button class="gap ${cls}" data-act="gap" data-g="${wi}" data-fk="g${wi}" aria-pressed="${on}" aria-label="Coma després de ${esc(w)}" ${disabled}>${ch}</button></span> `;
      }).join('')}</p>`;
  }

  if(it.t==='syl'){
    body = `<p class="prompt">Toca entre les lletres per separar la paraula en síl·labes.</p>
      <div class="syl-wrap"><div class="syl">${it.letters.map((l,li)=>{
        if(li===it.letters.length-1) return `<span class="ch">${esc(l)}</span>`;
        const on = it.ans.has(li); let cls='', ch = on ? '-' : '<span class="dot"></span>';
        if(it.checked){ const need = it.gaps.has(li); if(need&&on) cls='ok'; else if(need&&!on){cls='missed'; ch='-';} else if(!need&&on) cls='extra'; }
        return `<span class="ch">${esc(l)}</span><button class="gap ${cls}" data-act="gap" data-g="${li}" data-fk="g${li}" aria-pressed="${on}" aria-label="Separació després de la lletra ${li+1}" ${disabled}>${ch}</button>`;
      }).join('')}</div></div>`;
  }

  let fb = '';
  if(!it.checked && it.retry){
    const ri = it.retryInfo || {};
    fb = `<div class="fb warn" role="status">
      <div class="t">Encara no és correcte. Torna-ho a provar.</div>
      ${ri.note ? `<p><strong>${esc(ri.note)}</strong></p>` : ''}
      ${ri.partial ? `<p>Tens ${ri.partial[0]} de ${ri.partial[1]} paraules ben classificades.</p>` : ''}
      ${whyFor(it) ? `<p><strong>Pista:</strong> ${esc(whyFor(it))}</p>` : ''}
    </div>`;
  }
  if(it.checked){
    const g = grade(it);
    const why = whyFor(it);
    let sol = '';
    if(!g.ok){
      if(it.t==='write') sol = `<p>Resposta correcta: <strong>${esc(solutionText(it))}</strong></p>`;
      if(it.t==='comma' || it.t==='syl' || it.t==='fill') sol = `<p>Resposta correcta: <strong>${esc(solutionText(it))}</strong></p>`;
      if(it.t==='mc') sol = `<p>Resposta correcta: <strong>${esc(it.art ? artPhrase(it,it.a) : it.a)}</strong></p>`;
      if(it.t==='cls') sol = `<p>Has encertat ${g.partial[0]} de ${g.partial[1]}. Les respostes correctes estan marcades amb vora verda discontínua.</p>`;
    }
    fb = `<div class="fb ${g.ok?'ok':'ko'}" role="status">
      <div class="t">${g.ok ? (it.second ? '✓ Correcte al segon intent!' : '✓ Correcte!') : '✗ No és correcte'}</div>
      ${g.note ? `<p><strong>${esc(g.note)}</strong></p>` : ''}
      ${sol}
      ${why ? `<p>${esc(why)}</p>` : ''}
    </div>`;
  }

  const last = s.i === s.items.length-1;
  const actions = it.checked
    ? `<button class="btn primary" data-act="next" data-fk="next">${last ? 'Mostra el resultat' : 'Següent'}</button>`
    : `<button class="btn primary" data-act="check" data-fk="check">${it.retry ? 'Comprova de nou' : 'Comprova'}</button>`;

  return `
    <div class="progress">
      <span class="count">Exercici ${s.i+1} de ${s.items.length}</span>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.items.length}" aria-valuenow="${s.i}"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <div class="kindrow"><p class="kind">${esc(kindLabel(it))} · ${esc(it.topic.name)}</p>${it.checked ? '' : sayBtn(sayTextFor(it), 'Escolta l’enunciat')}</div>
      ${it.checked ? '' : `<details class="recall-ex" id="recallx" ${state.recallOpen?'open':''}><summary>Recorda la norma</summary>${it.topic.rules.map(r=>`<p><strong>${esc(/[.?!:]$/.test(r.h) ? r.h : r.h+'.')}</strong> ${fmt(r.p)}</p>`).join('')}</details>`}
      ${body}
      ${fb}
      <p class="msg" role="alert">${esc(state.msg)}</p>
      <div class="actions">
        ${actions}
        <button class="btn ghost" data-act="quit" data-fk="quit">Surt de la pràctica</button>
      </div>
    </div>`;
}

function userText(it){
  if(it.t==='mc') return it.art ? artPhrase(it, it.ans) : it.ans;
  if(it.t==='fill') return it.before+(it.ans||'')+it.after;
  if(it.t==='write') return it.ans;
  if(it.t==='comma') return it.words.map((w,i)=> w + (it.ans.has(i)?',':'')).join(' ');
  if(it.t==='syl') return it.letters.map((l,i)=> l + (it.ans.has(i)?'-':'')).join('');
  if(it.t==='cls') return '';
  return '';
}
function itemLabel(it){
  if(it.t==='mc') return plain(it.q);
  if(it.t==='fill') return 'Completa: '+it.before+'_'+it.after;
  if(it.t==='write') return it.q;
  if(it.t==='comma') return 'Posa les comes';
  if(it.t==='syl') return 'Separa en síl·labes';
  if(it.t==='cls') return it.q;
  return '';
}

function renderSummary(s){
  const res = s.items.map(it => ({it, g:grade(it)}));
  const n = res.filter(r=>r.g.ok).length;
  const L = s.items.length, second = s.items.filter(it => it.second).length;
  const msg = n===L ? 'Perfecte! Ho has encertat tot.' : n>=L*0.75 ? 'Molt bé! Repassa les errades de sota.' : n>=L*0.5 ? 'Vas pel bon camí. Revisa les errades i torna-ho a provar.' : 'Repassa les normes d’aquest bloc i torna-ho a provar.';
  const errs = res.filter(r=>!r.g.ok);
  return `
    <div class="card">
      <h2>Resultat</h2>
      <div class="score">${n}<span class="muted" style="font-size:.45em"> / ${s.items.length}</span></div>
      <p>${esc(msg)}</p>
      ${second ? `<p class="muted" style="margin-top:6px">${n-second} encertades al primer intent i ${second} al segon intent.</p>` : ''}
      ${errs.length ? `<h3 style="margin-top:22px">Per revisar</h3>
      <ul class="review">${errs.map(({it})=>{
        const u = userText(it);
        return `<li><div>${esc(itemLabel(it))}</div>
          ${u ? `<div class="you">La teva resposta: ${esc(u)}</div>` : ''}
          <div class="sol">Correcte: ${esc(it.t==='mc' && it.art ? artPhrase(it,it.a) : it.t==='mc' ? it.a : solutionText(it))}</div></li>`;
      }).join('')}</ul>` : ''}
      <div class="actions">
        <button class="btn primary" data-act="again" data-fk="again">Practica una altra vegada</button>
        <button class="btn" data-act="tab" data-tab="normes" data-fk="tonormes">Repassa les normes</button>
      </div>
    </div>`;
}

function render(){
  app.innerHTML = state.view==='home' ? renderHome() : state.view==='diec' ? renderDiec() : state.view==='pastorets' ? renderPastorets() : renderBloc();
  if(focusKey){ const el = app.querySelector(`[data-fk="${focusKey}"]`); if(el) el.focus({preventScroll:true}); }
  focusKey = null;
  const dta = app.querySelector('#dta');
  if(dta) dta.addEventListener('input', e => { if(state.dict) state.dict.text = e.target.value; if(state.dict && state.dict.msg) dictMsg(''); });
  const dq = app.querySelector('#diecq');
  if(dq){
    dq.addEventListener('input', e => {
      state.diecQ = e.target.value;
      const a = document.getElementById('dieclink'); if(a) a.href = state.diecQ.trim() ? DIEC_URL(state.diecQ) : '#';
      const m = document.getElementById('diecmsg'); if(m) m.textContent = '';
    });
    dq.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); const a = document.getElementById('dieclink'); if(a) a.click(); } });
  }
  const inp = app.querySelector('#inp');
  if(inp && !inp.readOnly){
    inp.addEventListener('input', e => { curItem().ans = e.target.value; if(state.msg){ state.msg=''; const m=app.querySelector('.msg'); if(m) m.textContent=''; } });
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); doCheck(); } });
  }
}
const curItem = () => state.session.items[state.session.i];
const scrollTop = () => window.scrollTo({top:0, behavior:'auto'});

function startSession(ti){
  state.session = buildSession(state.b, ti, state.sessLen); state.msg=''; state.tab='practica';
}
function doCheck(){
  const it = curItem();
  if(it.t==='mc' || it.t==='fill'){ if(it.ans===null || it.ans===undefined){ state.msg='Tria una opció abans de comprovar.'; render(); return; } }
  if(it.t==='write'){ if(!it.ans.trim()){ state.msg='Escriu una resposta abans de comprovar.'; focusKey='inp'; render(); return; } }
  if(it.t==='cls'){ const left = it.ans.filter(a=>a===null).length; if(left){ state.msg = left===1 ? 'Falta classificar 1 paraula.' : `Falten ${left} paraules per classificar.`; render(); return; } }
  if(it.t==='syl' && it.ans.size===0){ state.msg='Toca entre les lletres per marcar on se separen les síl·labes.'; render(); return; }
  if(it.t==='comma' && it.ans.size===0){ state.msg='Toca almenys un espai per posar-hi una coma.'; render(); return; }
  const g0 = grade(it);
  if(!g0.ok && !it.retry){
    it.retry = true; it.retryInfo = {note:g0.note, partial:g0.partial}; state.msg=''; focusKey='check'; render();
    const w = app.querySelector('.fb'); if(w && w.scrollIntoView) w.scrollIntoView({block:'nearest'});
    return;
  }
  it.second = !!(it.retry && g0.ok);
  it.checked = true; state.msg=''; focusKey='next'; render();
  const fb = app.querySelector('.fb'); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth'});
}

function onClick(e){
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act = el.dataset.act;
  if(act==='diec-open'){ Speech.stop(); state.view='diec'; focusKey='diecq'; render(); scrollTop(); return; }
  if(act==='pz-open'){ Speech.stop(); state.view='pastorets'; render(); scrollTop(); return; }
  if(act==='pz-go'){ const t = document.getElementById(el.dataset.id); if(t){ t.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); const h = t.querySelector('h2'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } } return; }
  if(act==='diec-go'){
    if(!(state.diecQ || '').trim()){
      e.preventDefault();
      const m = document.getElementById('diecmsg'); if(m) m.textContent = 'Escriu una paraula per cercar-la al diccionari.';
      const i = document.getElementById('diecq'); if(i) i.focus();
    }
    return;
  }
  if(act==='open'){ Speech.stop(); state.view='bloc'; state.b=+el.dataset.b; state.tab=el.dataset.tab; state.topicSel=-1; if(state.session && state.session.bi!==state.b) state.session=null; if(state.dict && state.dict.bi!==state.b) state.dict=null; if(!state.fx || state.fx.bi!==state.b) state.fx=newFx(); if(!state.pt || state.pt.bi!==state.b) state.pt=newPt(); render(); scrollTop(); return; }
  if(act==='home'){ Speech.stop(); state.view='home'; render(); scrollTop(); return; }
  if(act==='tab'){ if(el.dataset.tab!=='dictats') Speech.stop(); state.tab=el.dataset.tab; if(state.tab==='normes' && state.session && state.session.done) state.session=null; if(!state.fx || state.fx.bi!==state.b) state.fx=newFx(); if(!state.pt || state.pt.bi!==state.b) state.pt=newPt(); focusKey=el.dataset.fk; render(); return; }
  /* Opcions de lectura i àudio */
  if(act==='a11y'){ state.a11yOpen=!state.a11yOpen; focusKey='a11y'; render(); return; }
  if(act==='pref-fs'){ prefs.fs=+el.dataset.v; applyPrefs(); savePrefs(); focusKey=el.dataset.fk; render(); return; }
  if(act==='pref-sp'){ prefs.sp=!prefs.sp; applyPrefs(); savePrefs(); focusKey=el.dataset.fk; render(); return; }
  if(act==='pref-listen'){ prefs.listen=!prefs.listen; if(!prefs.listen) Speech.stop(); savePrefs(); focusKey=el.dataset.fk; render(); return; }
  if(act==='say'){ Speech.speak(el.dataset.say, false); return; }
  if(act==='say-stop'){ Speech.stop(); return; }
  if(act==='sess-len'){ state.sessLen=+el.dataset.n; focusKey=el.dataset.fk; render(); return; }
  /* Passatemps */
  if(act==='pt-sel'){ state.pt.sel=+el.dataset.t; focusKey=el.dataset.fk; render(); return; }
  if(act==='pt-play'){ state.pt.game=el.dataset.g; state.pt.level=el.dataset.l||'facil'; startGame(); render(); scrollTop(); return; }
  if(act==='pt-again'){ startGame(); render(); scrollTop(); return; }
  if(act==='pt-back'){ Speech.stop(); state.pt.game=null; state.pt.g=null; render(); scrollTop(); return; }
  if(state.pt && state.pt.g && /^(sopa|sil|rel)-/.test(act)){
    const g = state.pt.g;
    if(act==='sopa-cell') sopaTap(g, +el.dataset.i);
    if(act==='sopa-hint') sopaHint(g);
    if(act==='sopa-solve'){ g.words.forEach(w => { if(!w.found) w.rev = true; }); g.hint=null; g.sel=null; }
    if(act==='sopa-defs') g.defs = !g.defs;
    if(act==='sil-in') silPlace(g, +el.dataset.k);
    if(act==='sil-out'){ const j=+el.dataset.j; if(j>=g.locked) g.placed.splice(j,1); g.msg=''; }
    if(act==='sil-first'){ const k0 = g.tiles.findIndex(x => x.k===0); g.placed=[k0]; g.locked=1; g.msg='Pista: ja tens la primera síl·laba col·locada.'; g.msgType=''; }
    if(act==='sil-show'){ g.shown=true; }
    if(act==='sil-next'){ Speech.stop(); g.i++; if(g.i < g.queue.length) Object.assign(g, silWord(g.queue[g.i])); render(); scrollTop(); return; }
    if(act==='rel-l') relTap(g, 'L', +el.dataset.i);
    if(act==='rel-r') relTap(g, 'R', +el.dataset.i);
    if(act==='rel-hint') relHint(g);
    focusKey = el.dataset.fk || null; render(); return;
  }
  /* Dictats */
  if(act==='dict-open'){ openDictat(+el.dataset.d); render(); scrollTop(); return; }
  if(act==='dict-back'){ Speech.stop(); state.dict=null; render(); scrollTop(); return; }
  if(act==='dict-retry'){ openDictat(state.dict.di); render(); scrollTop(); return; }
  if(state.dict && act.startsWith('dict-')){
    const d = state.dict, T = d.data.frags.length;
    if(act==='dict-play'){
      if(d.frag < T-1){ d.frag++; Speech.speak(speakable(d.data.frags[d.frag], d.punct), d.slow); }
      else Speech.speak(speakable(d.data.full, d.punct), d.slow);
    }
    if(act==='dict-repeat' && d.frag>=0) Speech.speak(speakable(d.data.frags[d.frag], d.punct), d.slow);
    if(act==='dict-stop') Speech.stop();
    if(act==='dict-slow') d.slow = !d.slow;
    if(act==='dict-punct') d.punct = !d.punct;
    if(act==='dict-prev' && d.frag>0) d.frag--;
    if(act==='dict-adv' && d.frag<T-1) d.frag++;
    if(act==='dict-check'){
      if(!d.text.trim()){ dictMsg('Escriu el dictat abans de corregir-lo.'); return; }
      Speech.stop(); d.result = compareDictat(d.data.tokens, d.text); render(); scrollTop(); return;
    }
    updateDictControls(); return;
  }
  /* Fitxes */
  if(act==='fx-sel'){ state.fx.sel=+el.dataset.t; state.fx.sheet=null; state.fx.msg=''; focusKey=el.dataset.fk; render(); return; }
  if(act==='fx-opt'){ const k=el.dataset.k; state.fx[k]=!state.fx[k]; if(k==='big' && state.fx.sheet) state.fx.sheet = buildSheet(state.b, state.fx.sel, state.fx.big); focusKey=el.dataset.fk; render(); return; }
  if(act==='fx-gen'){ state.fx.sheet = buildSheet(state.b, state.fx.sel, state.fx.big); state.fx.msg=''; focusKey='fxgen'; render(); return; }
  if(act==='fx-pdf'){ downloadPDF(); return; }
  if(act==='sel'){ state.topicSel=+el.dataset.t; focusKey=el.dataset.fk; render(); return; }
  if(act==='start'){ startSession(state.topicSel); render(); scrollTop(); return; }
  if(act==='start-topic'){ state.topicSel=+el.dataset.t; startSession(state.topicSel); render(); scrollTop(); return; }
  if(act==='quit'){ state.session=null; state.msg=''; render(); scrollTop(); return; }
  if(act==='again'){ startSession(state.session.ti); render(); scrollTop(); return; }
  if(!state.session) return;
  const it = curItem();
  if(act==='opt'){ it.ans = el.dataset.v; state.msg=''; focusKey=el.dataset.fk; render(); return; }
  if(act==='cls'){ it.ans[+el.dataset.w] = +el.dataset.c; state.msg=''; focusKey=el.dataset.fk; render(); return; }
  if(act==='gap'){ const g=+el.dataset.g; it.ans.has(g) ? it.ans.delete(g) : it.ans.add(g); state.msg=''; focusKey=el.dataset.fk; render(); return; }
  if(act==='check'){ doCheck(); return; }
  if(act==='next'){
    const s = state.session;
    if(s.i < s.items.length-1){ s.i++; } else { s.done = true; }
    state.msg=''; render(); scrollTop();
    const first = app.querySelector('.opt, .seg button, .gap, #inp, .btn.primary'); if(first && !matchMedia('(pointer:coarse)').matches) first.focus({preventScroll:true});
  }
}

function insertChar(btn){
  const inp = document.getElementById(btn.dataset.target || 'inp'); if(!inp) return;
  const ch = btn.dataset.char;
  const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
  inp.setRangeText(ch, st, en, 'end');
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  inp.focus({preventScroll:true});
}

function init(){
  app = document.getElementById('app');
  app.addEventListener('click', e => {
    const c = e.target.closest('[data-char]');
    if(c){ if(e.detail===0) insertChar(c); return; }
    onClick(e);
  });
  app.addEventListener('pointerdown', e => {
    const c = e.target.closest('[data-char]');
    if(c){ e.preventDefault(); insertChar(c); }
  });
  app.addEventListener('toggle', e => {
    if(e.target && e.target.id==='tmode' && state.dict) state.dict.teacher = e.target.open;
    if(e.target && e.target.id==='recallx') state.recallOpen = e.target.open;
  }, true);
  loadPrefs();
  render();
  Speech.init();
  downloadsP = capUse('downloads');
}
if(typeof window!=='undefined' && typeof document!=='undefined') init();
</script>
